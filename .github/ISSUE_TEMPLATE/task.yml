name: Công việc / Task
description: Một đầu việc cần làm (tính năng, tài liệu, kiểm thử).
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Mục tiêu
      description: Cần làm gì và vì sao?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Hoàn thành khi
      description: Tiêu chí để coi là xong.
      placeholder: "- [ ] ...\n- [ ] Có kiểm thử / tài liệu"
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Thuộc phần
      options: ["Giao diện", "Máy chủ / API", "Năng lực cung cấp (capability)", "Dữ liệu và đăng nhập", "Tài liệu", "CI / Phát hành"]
