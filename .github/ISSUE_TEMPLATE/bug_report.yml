name: Báo lỗi / Bug report
description: Một chức năng của Junctura Pharmacy không chạy như mong đợi.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Mô tả lỗi
      description: Điều gì đã xảy ra và bạn mong đợi điều gì?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
      placeholder: |
        1. docker compose up -d
        2. Mở ...
        3. Thấy lỗi ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Phiên bản / commit
      placeholder: v0.1.0 hoặc mã commit
  - type: textarea
    id: env
    attributes:
      label: Môi trường
      description: Hệ điều hành, phiên bản Docker và Node. Không dán mật khẩu, nội dung .env hay dữ liệu bệnh nhân thật.
